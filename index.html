<!doctype html>
<!--
  WapiCare moved from /healthscope/ to /wapicare-app/ on 2026-10-25, when its
  repository was renamed. This page, served for every old address (also as
  404.html), sends the visitor to the same page at the new address.
-->
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>WapiCare</title>
    <link rel="canonical" href="https://map-data-engineering.github.io/wapicare-app/" />
    <script>
      location.replace(location.pathname.replace(/^\/healthscope(\/|$)/, '/wapicare-app/') + location.search + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://map-data-engineering.github.io/wapicare-app/" /></noscript>
    <style>
      body { margin: 0; padding: 24px 16px; font: 16px/1.5 system-ui, sans-serif; color: #1c1b1f; background: #fff; text-align: center; }
      a { color: #7d6214; font-weight: 700; }
    </style>
  </head>
  <body>
    <p>WapiCare imehamia <a href="https://map-data-engineering.github.io/wapicare-app/">map-data-engineering.github.io/wapicare-app</a></p>
    <p>WapiCare has moved to <a href="https://map-data-engineering.github.io/wapicare-app/">map-data-engineering.github.io/wapicare-app</a></p>
  </body>
</html>
